services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-brasa_delivery}
      MYSQL_USER: ${MYSQL_USER:-brasa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-brasa_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-brasa_root_dev_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - brasa_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  brasa_mysql_data:
